version: "3.9"

services:
  # Unified Floci UI Console
  floci-ui:
    image: floci/floci-ui:latest
    container_name: floci-ui
    ports:
      - "4500:4500"
    environment:
      - FLOCI_ENDPOINT=http://floci:4566
      - FLOCI_AZ_ENDPOINT=http://floci-az:4577
      - FLOCI_GCP_ENDPOINT=http://floci-gcp:4588

  # AWS Emulator
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Expose host daemon for Lambda/RDS execution
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health"]
      interval: 2s
      timeout: 2s
      retries: 5

  # GCP Emulator
  floci-gcp:
    image: floci/floci-gcp:latest
    container_name: floci-gcp
    ports:
      - "4588:4588"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4588/health"]
      interval: 2s
      timeout: 2s
      retries: 5

  # Azure Emulator
  floci-az:
    image: floci/floci-az:latest
    container_name: floci-az
    ports:
      - "4577:4577"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4577/health"]
      interval: 2s
      timeout: 2s
      retries: 5

  # Standalone Redis service for Agnostic Cache Strategy testing
  redis:
    image: redis:7-alpine
    container_name: floci-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 5

  # OCI Emulator
  floci-oci:
    image: floci/floci-oci:latest
    container_name: floci-oci
    ports:
      - "4599:4599"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4599/health"]
      interval: 2s
      timeout: 2s
      retries: 5
